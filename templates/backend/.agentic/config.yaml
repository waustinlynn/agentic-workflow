# Backend repository configuration (Python / Node / Go / .NET)
# Copy to <your-repo>/.agentic/config.yaml and adjust setup_commands/verify_commands for your stack.
#
# Recommended GitHub repo settings:
#   - Enable "Allow auto-merge" in Settings -> General -> Pull Requests
#   - Protect `main`: require 1 approving review (agentic-reviewer[bot]) + passing `CI` check

version: 1
stack: backend

git:
  default_branch: main
  branch_prefix: agent/
  commit_style: conventional

execution:
  target: local        # Switch to 'lambda' with runtime: python|node|go|dotnet in Phase 2
  runtime: python
  max_review_rounds: 3
  timeout_minutes: 12
  working_directory: .
  setup_commands:
    - uv sync --dev
  verify_commands:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy src tests
    - uv run pytest

review:
  wait_for_ci: true
  auto_merge: true
  merge_method: squash
  extra_checklist:
    - "Verify input validation, auth checks, and error handling on all endpoints"
    - "Confirm database/external I/O calls are injected behind testable seams"

safety:
  protected_paths:
    - .github/workflows/**
    - .agentic/**
    - CODEOWNERS
  allow_external_forks: false
