[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflow"
version = "0.1.0"
description = "GitHub webhook-driven agentic software development framework backed by AWS SQS FIFO and Google Antigravity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyjwt[crypto]>=2.8,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
agentic = "worker.onboard:main"
agentic-local-runner = "worker.local_runner:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/shared",
    "src/ingest",
    "src/worker",
    "src/reviewer",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
